<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nanwakolas Marine COP — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — lifted from the wireframes. Every colour in
   this prototype comes from here. When the palette changes,
   this block is the only place you edit.
   ============================================================ */
:root{
  --paper:#FDFCF9;
  --panel:#EFECE5;
  --line:#5C6B73;
  --line-soft:#D8D4CC;
  --slate:#5C6B73;
  --muted:#8B9499;
  --ink:#333;
  --green:#0F6E56;
  --amber:#D97706;
  --amber-pale:#FAEEDA;
  --amber-deep:#854F0B;
  --coral:#D85A30;
  --tide:#1D9E75;
  --copper:#9A5B2B;
  --violet:#7F77DD;
  --map-water:#EEF3F3;
  --map-water-2:#E4ECEC;
  --map-land:#F4F1E9;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --display:'Archivo',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--mono);font-size:11px;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

/* ---------- app shell ---------- */
#app{display:flex;height:100vh;min-width:1080px}

/* ---------- nav rail ---------- */
.rail{width:56px;flex:none;border-right:1px solid var(--ink);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:9px;background:var(--paper)}
.crest{width:26px;height:26px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 9px var(--mono);margin-bottom:2px}
.navitem{width:52px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;border-left:2px solid transparent;transition:background .12s}
.navitem .glyph{width:16px;height:16px;border:1px solid var(--slate);display:flex;align-items:center;justify-content:center}
.navitem .glyph svg{width:11px;height:11px;stroke:var(--slate);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.navitem .lbl{font:500 7px var(--mono);color:var(--slate);letter-spacing:.03em}
.navitem:hover{background:#F3F1EB}
.navitem.on{background:var(--amber-pale);border-left-color:var(--amber)}
.navitem.on .glyph{border-color:var(--amber-deep);border-width:1.5px}
.navitem.on .glyph svg{stroke:var(--amber-deep)}
.navitem.on .lbl{color:var(--amber-deep);font-weight:600}
.avatar{width:24px;height:24px;border:1px solid var(--slate);border-radius:50%;display:flex;align-items:center;justify-content:center;font:500 8px var(--mono);color:var(--slate)}

/* ---------- main column ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{height:56px;flex:none;border-bottom:1px solid var(--ink);display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--paper)}
.wordmark{display:flex;align-items:center;gap:8px;flex:none}
.wordmark .ring{width:22px;height:22px;border:1px solid var(--green);border-radius:50%}
.wordmark .txt{font:700 15px var(--display);color:var(--green);white-space:nowrap}

.switcher{position:relative;flex:none}
.switcher-btn{width:310px;height:30px;border:1px solid var(--slate);border-radius:4px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font:400 11px var(--mono);color:var(--slate);text-align:left}
.switcher-btn:hover{border-color:var(--ink)}
.switcher-btn.live{border-color:var(--amber);border-width:1.5px;background:var(--amber-pale);color:var(--amber-deep);font-weight:500}
.menu{position:absolute;top:34px;left:0;width:310px;background:#fff;border:1px solid var(--slate);border-radius:4px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.10);overflow:hidden}
.menu-item{display:block;width:100%;text-align:left;padding:8px 10px;font:400 11px var(--mono);color:var(--slate);border-bottom:1px solid var(--line-soft)}
.menu-item:last-child{border-bottom:none}
.menu-item:hover{background:var(--panel)}
.menu-item .m1{color:var(--ink);font-weight:500}
.menu-item .m2{color:var(--muted);font-size:10px;margin-top:2px}

.search{flex:1;max-width:300px;height:30px;border:1px dashed var(--slate);border-radius:4px;display:flex;align-items:center;padding:0 10px;font:400 11px var(--mono);color:var(--muted)}
.clock{margin-left:auto;font:400 11px var(--mono);color:var(--slate);flex:none}

/* ---------- generic page furniture ---------- */
.body{flex:1;display:flex;min-height:0}
.pagebar{height:44px;flex:none;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--paper)}
.pagetitle{font:600 13px var(--display);color:var(--ink)}
.chip{border:1px solid var(--slate);border-radius:3px;padding:3px 8px;font:400 10px var(--mono);color:var(--slate)}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--panel);border-color:var(--ink);color:var(--ink)}
.stat{display:flex;flex-direction:column;gap:1px}
.stat .k{font:500 8px var(--mono);color:var(--muted);letter-spacing:.06em}
.stat .v{font:600 13px var(--mono);color:var(--ink)}
.count{margin-left:auto;font:400 10px var(--mono);color:var(--muted)}

.scroll{overflow:auto;min-height:0}
.scroll::-webkit-scrollbar{width:8px;height:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-soft);border-radius:4px}

table{width:100%;border-collapse:collapse}
thead th{font:500 8px var(--mono);color:var(--muted);letter-spacing:.06em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--slate);background:var(--paper);position:sticky;top:0;z-index:2}
tbody td{padding:9px 10px;border-bottom:1px solid var(--line-soft);font:400 10px var(--mono);color:var(--ink);vertical-align:middle}
tbody tr:hover{background:#F7F5EF}
.sub{color:var(--muted);font-size:9px}

.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.sq{display:inline-block;width:6px;height:6px;margin-right:5px;vertical-align:1px}
.tag{display:inline-block;border:1px solid var(--slate);border-radius:2px;padding:1px 5px;font:500 9px var(--mono);color:var(--slate);margin-right:3px}
.tag.warn{border-color:var(--amber);color:var(--amber-deep);background:var(--amber-pale)}
.tag.sens{border-color:var(--coral);color:var(--coral)}
.tag.ok{border-color:var(--tide);color:var(--tide)}
.overdue{color:var(--coral);font-weight:600}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px;text-align:center}
.empty .mark{width:34px;height:34px;border:1px dashed var(--slate);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.empty .t{font:500 12px var(--mono);color:var(--ink)}
.empty .d{font:400 10px var(--mono);color:var(--muted);max-width:290px;line-height:1.6}
.btn{border:1px solid var(--slate);border-radius:3px;padding:6px 12px;font:500 10px var(--mono);color:var(--ink);letter-spacing:.04em}
.btn:hover{background:var(--panel)}
.btn.primary{border-color:var(--amber);background:var(--amber-pale);color:var(--amber-deep);border-width:1.5px}
.btn.primary:hover{background:#F6E4C6}

/* ---------- map ---------- */
.mapwrap{flex:1;position:relative;min-width:0;background:var(--map-water);overflow:hidden}
.mapwrap svg.base{position:absolute;inset:0;width:100%;height:100%}
.maplabel{position:absolute;bottom:8px;right:10px;font:400 9px var(--mono);color:var(--muted);background:rgba(253,252,249,.85);padding:3px 7px;border-radius:3px}
.float{position:absolute;background:var(--paper);border:1px solid var(--slate);border-radius:4px;z-index:20}
.float .fh{font:600 8px var(--mono);color:var(--muted);letter-spacing:.08em;padding:8px 10px 6px}
.layers{top:12px;left:12px;width:198px}
.lgroup{font:600 7px var(--mono);color:var(--muted);letter-spacing:.08em;padding:7px 10px 3px;border-top:1px solid var(--line-soft)}
.lrow{display:flex;align-items:center;gap:7px;padding:4px 10px;font:400 10px var(--mono);color:var(--ink)}
.lrow:hover{background:#F3F1EB}
.sw{width:8px;height:8px;flex:none}
.toggle{margin-left:auto;width:22px;height:12px;border-radius:6px;border:1px solid var(--slate);position:relative;flex:none}
.toggle i{position:absolute;top:1px;left:1px;width:8px;height:8px;border-radius:50%;background:var(--slate);transition:transform .14s}
.toggle.on{background:var(--tide);border-color:var(--tide)}
.toggle.on i{background:#fff;transform:translateX(10px)}
.legend{bottom:12px;left:12px;width:150px}
.tools{top:12px;right:12px;display:flex;gap:6px;z-index:20}
.tool{border:1px solid var(--slate);border-radius:3px;padding:5px 9px;font:500 9px var(--mono);color:var(--slate);background:var(--paper);letter-spacing:.05em}
.tool:hover{border-color:var(--ink);color:var(--ink)}
.tool.live{border-color:var(--tide);color:var(--tide)}
.tool.live .pulse{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--tide);margin-right:4px;vertical-align:1px;animation:beat 2s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.tool.live .pulse{animation:none}}

.marker{cursor:pointer}
.marker circle,.marker rect,.marker polygon{transition:opacity .12s}
.marker:hover .hit{opacity:.22}
.marker.sel .ring2{opacity:1}

/* ---------- selected feature card ---------- */
.card{position:absolute;top:12px;right:12px;width:290px;background:var(--paper);border:1.5px solid var(--amber);border-radius:4px;z-index:30;animation:slidein .18s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card .ch{background:var(--amber-pale);padding:8px 11px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid var(--amber)}
.card .ck{font:600 8px var(--mono);color:var(--amber-deep);letter-spacing:.08em}
.card .cn{font:600 12px var(--display);color:var(--ink);margin-top:3px}
.card .cid{font:400 9px var(--mono);color:var(--amber-deep);margin-top:1px}
.card .x{font-size:14px;line-height:1;color:var(--amber-deep);flex:none}
.card .grid{display:grid;grid-template-columns:1fr 1fr}
.card .cell{padding:8px 11px;border-bottom:1px solid var(--line-soft)}
.card .cell:nth-child(odd){border-right:1px solid var(--line-soft)}
.card .cell .k{font:500 7px var(--mono);color:var(--muted);letter-spacing:.06em}
.card .cell .v{font:500 10px var(--mono);color:var(--ink);margin-top:2px}
.sensband{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--line-soft)}
.sensband .n{font:600 17px var(--mono);color:var(--coral)}
.sensband .d{font:400 9px var(--mono);color:var(--coral);line-height:1.4}
.card .foot{padding:9px 11px}

/* ---------- dock ---------- */
.dock{flex:none;border-top:1px solid var(--ink);background:var(--paper)}
.dock-readiness{display:grid;grid-template-columns:repeat(6,1fr);height:104px}
.rcard{border-right:1px solid var(--line-soft);padding:11px 12px;display:flex;flex-direction:column;gap:2px}
.rcard:last-child{border-right:none}
.rcard .k{font:500 8px var(--mono);color:var(--muted);letter-spacing:.06em}
.rcard .v{font:600 26px var(--mono);color:var(--ink);line-height:1.05;margin-top:2px}
.rcard .v small{font-size:12px;font-weight:400;color:var(--muted)}
.rcard .d{font:400 9px var(--mono);color:var(--slate);line-height:1.4;margin-top:auto}
.rcard.flag{background:#FCF8F1;border-left:2px solid var(--amber)}
.rcard.flag .v{color:var(--amber-deep)}
.dock-ops{display:flex;height:104px;background:var(--amber-pale);border-top:2px solid var(--amber)}
.ops-id{padding:11px 14px;border-right:1px solid rgba(133,79,11,.22);min-width:300px;display:flex;flex-direction:column;gap:2px}
.ops-id .k{font:600 8px var(--mono);color:var(--amber-deep);letter-spacing:.08em}
.ops-id .n{font:700 15px var(--display);color:var(--ink);margin-top:3px}
.ops-id .d{font:400 9px var(--mono);color:var(--amber-deep);margin-top:auto}
.ops-cell{flex:1;padding:11px 14px;border-right:1px solid rgba(133,79,11,.22);display:flex;flex-direction:column;gap:2px}
.ops-cell .k{font:500 8px var(--mono);color:var(--amber-deep);letter-spacing:.06em}
.ops-cell .v{font:600 22px var(--mono);color:var(--ink);line-height:1.05;margin-top:2px}
.ops-cell .d{font:400 9px var(--mono);color:var(--amber-deep);margin-top:auto}
.ops-act{padding:11px 14px;display:flex;align-items:center;flex:none}

/* ---------- incident page ---------- */
.ihead{flex:none;border-bottom:1px solid var(--line-soft);background:var(--amber-pale);display:flex;align-items:stretch;gap:0}
.ihead .blk{padding:10px 14px;border-right:1px solid rgba(133,79,11,.22);display:flex;flex-direction:column;gap:2px;justify-content:center}
.ihead .k{font:600 8px var(--mono);color:var(--amber-deep);letter-spacing:.08em}
.ihead .n{font:700 14px var(--display);color:var(--ink)}
.ihead .d{font:400 9px var(--mono);color:var(--amber-deep)}
.ihead .v{font:600 15px var(--mono);color:var(--ink)}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--slate);background:var(--paper);padding:0 6px}
.tab{padding:9px 13px;display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;font:500 10px var(--mono);color:var(--slate);letter-spacing:.04em}
.tab:hover{color:var(--ink)}
.tab .b{border:1px solid var(--line-soft);border-radius:8px;padding:0 5px;font:500 9px var(--mono);color:var(--muted);min-width:16px;text-align:center}
.tab.on{color:var(--ink);border-bottom-color:var(--amber);font-weight:600}
.tab.on .b{border-color:var(--amber);background:var(--amber-pale);color:var(--amber-deep)}
.obs{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.obs:hover{background:#F7F5EF}
.thumb{width:46px;height:46px;flex:none;border:1px solid var(--line-soft);background:var(--map-water-2);display:flex;align-items:center;justify-content:center;font:400 7px var(--mono);color:var(--muted)}
.obs .t{font:500 11px var(--mono);color:var(--ink)}
.obs .m{font:400 9px var(--mono);color:var(--muted);margin-top:3px;line-height:1.5}
.pin{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1.5px solid var(--amber);color:var(--amber-deep);font:600 9px var(--mono);display:flex;align-items:center;justify-content:center}

/* ---------- detail panels ---------- */
.panel{width:300px;flex:none;border-left:1px solid var(--slate);display:flex;flex-direction:column;background:var(--paper)}
.panel .ph{padding:9px 12px;border-bottom:1px solid var(--slate);background:var(--panel)}
.panel .pk{font:600 8px var(--mono);color:var(--muted);letter-spacing:.08em}
.panel .pn{font:600 12px var(--display);color:var(--ink);margin-top:3px}
.field{padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.field .k{font:500 7px var(--mono);color:var(--muted);letter-spacing:.06em}
.field .v{font:400 10px var(--mono);color:var(--ink);margin-top:3px;line-height:1.6}
.pdf{margin:12px;border:1px dashed var(--slate);height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted);font:400 9px var(--mono);background:#FAF8F3}
.listcol{width:250px;flex:none;border-left:1px solid var(--slate);display:flex;flex-direction:column}
.lrowitem{padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.lrowitem:hover{background:#F7F5EF}
.lrowitem.on{background:var(--panel);border-left:2px solid var(--violet)}
.lrowitem .t{font:600 10px var(--mono);color:var(--ink)}
.lrowitem .d{font:400 9px var(--mono);color:var(--muted);margin-top:2px}

/* ---------- refuge decision tree ---------- */
.tree{padding:12px 14px}
.q{border:1px solid var(--slate);border-radius:3px;padding:9px 11px;font:400 10px var(--mono);color:var(--ink);line-height:1.5;background:var(--paper)}
.branch{display:flex;gap:8px;padding:6px 0 6px 14px}
.branch .opt{flex:1;border:1px solid var(--line-soft);border-radius:3px;padding:6px 9px;font:500 9px var(--mono);color:var(--slate)}
.branch .opt:hover{border-color:var(--ink);color:var(--ink)}
.branch .opt.on{border-color:var(--amber);background:var(--amber-pale);color:var(--amber-deep)}
.outcomes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.outcome{border:1px solid var(--line-soft);border-radius:3px;padding:9px}
.outcome .t{font:600 10px var(--mono);color:var(--slate)}
.outcome .d{font:400 9px var(--mono);color:var(--muted);margin-top:3px;line-height:1.4}
.outcome.hit{border-color:var(--tide);border-width:1.5px;background:#F1FAF6}
.outcome.hit .t{color:var(--tide)}
.consider{border-top:1px solid var(--slate);padding:11px 14px}
.consider .ck{font:600 8px var(--mono);color:var(--muted);letter-spacing:.08em;margin-bottom:7px}
.consider li{list-style:none;font:400 9px var(--mono);color:var(--ink);line-height:1.6;padding-left:12px;position:relative;margin-bottom:5px}
.consider li:before{content:'';position:absolute;left:0;top:6px;width:4px;height:4px;background:var(--slate)}
.consider li.sens:before{background:var(--coral)}

/* ---------- prototype hint bar ---------- */
.hint{position:fixed;bottom:0;left:0;right:0;height:26px;background:var(--ink);color:#E8E6E0;display:flex;align-items:center;gap:14px;padding:0 14px;font:400 9px var(--mono);z-index:200}
.hint b{color:#fff;font-weight:500}
.hint .close{margin-left:auto;cursor:pointer;font-size:12px}
body.hinted #app{height:calc(100vh - 26px)}
</style>
</head>

  <span class="close" id="hintclose">✕</span>
</div>

function marker(kind, x, y, opts){
  opts = opts || {};
  const sel = opts.sel ? 'sel' : '';
  const attrs = `class="marker ${sel}" ${opts.click ? `data-${opts.click}="${opts.id}"` : ''} tabindex="0" role="button" aria-label="${esc(opts.label||kind)}"`;
  if(kind === 'incident'){
    return `<g ${attrs} transform="translate(${x},${y})">
      <circle class="ring2" r="17" fill="none" stroke="var(--amber)" stroke-width="1.2" opacity="${opts.sel?1:0}"/>
      <circle class="hit" r="15" fill="var(--amber)" opacity="0"/>
      <circle r="9" fill="var(--amber-pale)" stroke="var(--amber)" stroke-width="2"/>
      <circle r="3.2" fill="var(--amber)"/></g>`;
  }
  if(kind === 'historic'){
    return `<g ${attrs} transform="translate(${x},${y})">
      <circle class="hit" r="12" fill="var(--slate)" opacity="0"/>
      <circle r="5.5" fill="#fff" stroke="var(--slate)" stroke-width="1.4"/></g>`;
  }
  if(kind === 'grs'){
    return `<g ${attrs} transform="translate(${x},${y})">
      <circle class="ring2" r="14" fill="none" stroke="var(--violet)" stroke-width="1.2" opacity="${opts.sel?1:0}"/>
      <circle class="hit" r="13" fill="var(--violet)" opacity="0"/>
      <rect x="-5.5" y="-5.5" width="11" height="11" fill="#fff" stroke="var(--violet)" stroke-width="1.8"/>
      <rect x="-2" y="-2" width="4" height="4" fill="var(--violet)"/></g>`;
  }
  if(kind === 'resource'){
    return `<g ${attrs} transform="translate(${x},${y})">
      <circle class="hit" r="12" fill="var(--tide)" opacity="0"/>
      <path d="M-6,3 L0,-6 L6,3 Z" fill="#fff" stroke="var(--tide)" stroke-width="1.6"/></g>`;
  }
  if(kind === 'infra'){
    return `<g ${attrs} transform="translate(${x},${y})">
      <circle class="hit" r="12" fill="var(--copper)" opacity="0"/>
      <rect x="-5" y="-5" width="10" height="10" fill="#fff" stroke="var(--copper)" stroke-width="1.6"/></g>`;
  }
  if(kind === 'sens'){
    return `<g ${attrs} transform="translate(${x},${y})">
      <path d="M0,-6.5 L6,5 L-6,5 Z" fill="#fff" stroke="var(--coral)" stroke-width="1.6"/></g>`;
  }
  if(kind === 'refuge'){
    return `<g ${attrs} transform="translate(${x},${y})">
      <circle class="ring2" r="19" fill="none" stroke="var(--tide)" stroke-width="1.2" opacity="${opts.sel?1:0}"/>
      <circle class="hit" r="17" fill="var(--tide)" opacity="0"/>
      <circle r="13" fill="none" stroke="var(--tide)" stroke-width="1.2" stroke-dasharray="3 2"/>
      <circle r="4" fill="#fff" stroke="var(--tide)" stroke-width="1.6"/></g>`;
  }
  return '';
}

        <div style="display:grid;grid-template-columns:1fr 1fr">
          <div class="cell" style="padding:7px 10px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)"><div class="k" style="font:500 7px var(--mono);color:var(--muted)">HOLDING</div><div style="font:500 9px var(--mono);margin-top:2px">${esc(r.hold)}</div></div>
          <div class="cell" style="padding:7px 10px;border-bottom:1px solid var(--line-soft)"><div class="k" style="font:500 7px var(--mono);color:var(--muted)">EXPOSURE</div><div style="font:500 9px var(--mono);margin-top:2px">${esc(r.exp)}</div></div>
          <div class="cell" style="padding:7px 10px;border-right:1px solid var(--line-soft)"><div class="k" style="font:500 7px var(--mono);color:var(--muted)">PRESCAT</div><div style="font:500 9px var(--mono);margin-top:2px">${esc(r.prescat)}</div></div>
          <div class="cell" style="padding:7px 10px"><div class="k" style="font:500 7px var(--mono);color:var(--coral)">SENSITIVE</div><div style="font:500 9px var(--mono);margin-top:2px;color:var(--coral)">${esc(r.sens)}</div></div>
        </div>
      </div>
      <div class="maplabel">anchorage areas + PreSCAT shoreline segments</div>
    </div>
    <div class="panel" style="width:394px">
      <div class="ph">
        <div class="pn">Place of Refuge decision</div>
        <div class="sub" style="margin-top:2px">council-endorsed assessment · ${r.id} shown${r.endorsed?' ✓':''}</div>
      </div>
      <div class="scroll" style="flex:1">
        <div class="tree">
          ${q('q1','Vessel requests refuge — is there an immediate risk to life?','YES → SAR first, CCG lead','NO ↓')}
          ${q('q2','Is pollution risk lower at anchor than underway or offshore?','YES ↓','NO → deny, monitor offshore')}
          ${q('q3','Cultural or environmental sensitivity within influence zone?','YES → conditions + consultation','NO ↓')}
          <div class="outcomes">
            <div class="outcome ${outcome==='grant'?'hit':''}"><div class="t">GRANT</div><div class="d">with monitoring</div></div>
            <div class="outcome ${outcome==='cond'?'hit':''}"><div class="t">GRANT W/ CONDITIONS</div><div class="d">boom staged, tug standby</div></div>
            <div class="outcome ${(outcome==='deny'||outcome==='sar')?'hit':''}"><div class="t">DENY</div><div class="d">escalate to CCG</div></div>
          </div>
          ${outcome ? `<div style="margin-top:10px"><button class="btn" data-resetans="1">Reset decision</button></div>` : ''}
        </div>
        <div class="consider">
          <div class="ck">CONSIDERATIONS — WELCOMING A VESSEL</div>
          <ul>
            <li class="sens">Cultural &amp; environmental sensitivity — consult nation reps before granting; sensitive sites shown as generic markers only</li>
            <li>PreSCAT shoreline class — cleanup difficulty if containment fails</li>
            <li>Holding ground, depth &amp; swing room for vessel size</li>
            <li>Weather exposure &amp; forecast window (48 h)</li>
            <li>Response access — nearest GRS site, boom transit time, launch points</li>
            <li>Community proximity — air quality, vessel traffic, harvest areas</li>
            <li>Jurisdiction — Transport Canada / CCG lead, nation consent role</li>
          </ul>
        </div>
      </div>
    </div>
  </div>`;
}

function pagePlans(){

        <span style="font:600 11px var(--display)">Exercises</span><span class="sub">next drill Aug 6</span>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0">
        <div style="border-right:1px solid var(--line-soft);padding:12px 14px">

/* ============================================================
   RENDER — rebuild the whole shell from state on every change.
   Crude but predictable, and it mirrors how React works.
   ============================================================ */
const ROUTES = {cop:pageCOP, incident:pageIncident, log:pageLog, assets:pageAssets,
                crew:pageCrew, grs:pageGRS, refuge:pageRefuge, plans:pagePlans};

function render(){
  const page = (ROUTES[state.page] || pageCOP)();
  document.getElementById('app').innerHTML =
    navRail() + `<div class="main">` + header() + page + `</div>`;
}

/* ---------- events: one listener, data-attribute routing ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-menu],[data-pick],[data-feature],[data-clearfeature],[data-tab],[data-grs],[data-grsjump],[data-refuge],[data-ans],[data-resetans],[data-logfilter],[data-layer]');

  if(!t){
    if(state.menuOpen){ state.menuOpen = false; render(); }
    return;
  }
  const d = t.dataset;

  if(d.nav){ state.page = d.nav; state.menuOpen = false; render(); return; }
  if(d.menu){ state.menuOpen = !state.menuOpen; render(); return; }

  if(d.pick){
    state.activeIncidentId = d.pick === 'none' ? null : d.pick;
    state.selectedFeature = null;
    state.menuOpen = false;
    if(d.pick === 'none' && state.page === 'incident') state.page = 'cop';
    render(); return;
  }

  if(d.feature){
    // Selecting a historic incident also makes it the active context,
    // so the incident page has something to show.
    if(state.activeIncidentId !== d.feature){
      const f = DATA.incidents.find(i => i.id === d.feature);
      if(f && f.status === 'active') state.activeIncidentId = d.feature;
    }
    state.selectedFeature = d.feature; render(); return;
  }
  if(d.clearfeature){ state.selectedFeature = null; render(); return; }

  if(d.tab){ state.incidentTab = d.tab; render(); return; }
  if(d.grs){ state.grsSelected = d.grs; render(); return; }
  if(d.grsjump){ state.grsSelected = d.grsjump; state.page = 'grs'; render(); return; }
  if(d.refuge){ state.refugeSelected = d.refuge; render(); return; }

  if(d.ans){
    const [k,v] = d.ans.split(':');
    state.answers[k] = state.answers[k] === v ? null : v;
    render(); return;
  }
  if(d.resetans){ state.answers = {q1:null,q2:null,q3:null}; render(); return; }
  if(d.logfilter){ state.logFilter = d.logfilter; render(); return; }
  if(d.layer){ state.layers[d.layer] = !state.layers[d.layer]; render(); return; }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(state.menuOpen){ state.menuOpen = false; render(); }
    else if(state.selectedFeature){ state.selectedFeature = null; render(); }
  }
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-grs],[data-refuge],[data-feature]')){
    e.preventDefault(); e.target.click();
  }
});

document.getElementById('hintclose').addEventListener('click', () => {
  document.getElementById('hint').style.display = 'none';
  document.body.classList.remove('hinted');
});

render();
</script>
